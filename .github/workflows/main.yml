name: 'publish'
on:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: ${{ matrix.settings.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt install -y \
            lld \
            llvm \
            nsis \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: yarn install

      - name: Prepare signing key
        run: |
          node -e "
          const rawKey = process.env.RAW_KEY.trim();
          const comment = 'untrusted comment: minisign secret key D883434EB0DEE408';
          const fs = require('fs');

          // Check if the secret is already a base64-encoded full key (decodes to start with 'untrusted comment:')
          let alreadyEncoded = false;
          try {
            const decoded = Buffer.from(rawKey, 'base64').toString('utf8');
            if (decoded.startsWith('untrusted comment:')) {
              alreadyEncoded = true;
            }
          } catch(e) {}

          let encoded;
          if (alreadyEncoded) {
            // Already base64(full key with comment) - use as-is
            encoded = rawKey;
          } else if (rawKey.startsWith('untrusted comment:')) {
            // Raw full key text - just base64-encode it
            encoded = Buffer.from(rawKey).toString('base64');
          } else {
            // Just the key data line - prepend comment, then base64-encode
            const fullKey = comment + '\n' + rawKey + '\n';
            encoded = Buffer.from(fullKey).toString('base64');
          }

          fs.appendFileSync(process.env.GITHUB_ENV, 'TAURI_SIGNING_KEY=' + encoded + '\n');
          "
        env:
          RAW_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      - uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_KEY }}
        with:
          tagName: tts-helper-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: 'TTS Helper v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
